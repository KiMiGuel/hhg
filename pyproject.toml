[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["data", "models", "reports", "cache", "scripts/dev"]

[tool.ruff.lint]
# E/F: pycodestyle / pyflakes; W: pycodestyle warnings; I: isort; B: bugbear;
# UP: pyupgrade; SIM: simplify; C4: comprehensions; RUF: ruff-specific.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    "E501",  # line length is governed by formatter
    "B008",  # function call in default argument (used in many tests)
    "RUF012", # mutable class attributes (used for dataclass sentinels)
]

[tool.ruff.lint.per-file-ignores]
# Test files often have unused fixtures and longer lines.
"tests/**" = ["B011", "B017"]
"scripts/**" = ["E402"]  # imports after path manipulation

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]
