name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check src tests scripts
      - name: Black
        run: black --check src tests scripts

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run pytest
        run: |
          python -m pytest tests/ -v --tb=short --ignore=tests/test_blockchain_integration.py --ignore=tests/test_face_detection_real.py
      - name: Verify pipeline modules compile
        run: |
          python -m py_compile pipeline.py verify.py main.py
          python -m py_compile src/*.py
          python -m py_compile scripts/*.py

  benchmark:
    name: Local accuracy benchmark (no SerpApi)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run master_accuracy (quick subset)
        run: |
          if [ -d data/eval ] && [ -d data/hard_eval ]; then
            python scripts/master_accuracy.py --quick
          else
            echo "::notice::Benchmark corpus absent (data/eval, data/hard_eval). Regenerate locally via scripts/build_test_corpus.py; skipping benchmark gate."
          fi
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: reports/real_accuracy_benchmark_*.json
          if-no-files-found: ignore

